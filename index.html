<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose Your MIS 221 Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#1A1014;overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;flex:none;transform-origin:center center;background:#2A1A20;font-family:'Zen Maru Gothic',Nunito,sans-serif;color:#3B2A2E}
#stage.phone{width:390px;height:844px}
#stage.desktop{width:1280px;height:720px}
.bg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
#stage.phone .bg{object-position:74% 50%}
.abs{position:absolute}
.mincho{font-family:'Shippori Mincho',serif}
button{font:inherit;color:inherit}
.btn{cursor:pointer;transition:background .18s ease,color .18s ease,box-shadow .18s ease,filter .25s ease,transform .3s ease}
.btn:focus-visible{outline:3px solid #4C86C6;outline-offset:3px}
.win{position:absolute;box-sizing:border-box;background:linear-gradient(180deg,rgba(255,253,249,.93),rgba(250,243,236,.89));border:1px solid rgba(158,27,50,.45);border-radius:14px;box-shadow:0 0 0 4px rgba(255,252,247,.35),0 0 0 5px rgba(201,160,96,.6),0 14px 30px rgba(30,12,18,.4);display:flex;flex-direction:column;gap:10px}
.ribbon{position:absolute;top:-16px;left:14px;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#7A1224,#B42A44);color:#fff;font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px;padding:6px 26px 6px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.ribbon i{font-style:normal;color:#E8CD98;font-size:10px}
.choice{position:relative;display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:none;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;line-height:1.45;background:linear-gradient(90deg,rgba(255,252,247,0) 0%,rgba(255,252,247,.95) 12%,rgba(255,252,247,.95) 88%,rgba(255,252,247,0) 100%);color:#3B2A2E}
.choice:hover{background:linear-gradient(90deg,rgba(138,21,41,0) 0%,rgba(138,21,41,.93) 12%,rgba(138,21,41,.93) 88%,rgba(138,21,41,0) 100%);color:#fff}
.choice:hover .mark{color:#E8CD98}
.choice .line{position:absolute;left:12%;right:12%;height:1px;background:linear-gradient(90deg,rgba(201,160,96,0),#C9A060,rgba(201,160,96,0))}
.mark{flex:none;font-family:'Shippori Mincho',serif;font-weight:800;color:#8A1529;padding-top:1px}
.plate{background:linear-gradient(90deg,#7A1224,#B42A44 50%,#7A1224);color:#fff;border:1px solid #E8CD98;border-radius:4px;font-family:'Shippori Mincho',serif;font-weight:700}
.plate:hover{background:linear-gradient(90deg,#8A1529,#CC3E58 50%,#8A1529);box-shadow:0 0 0 2px #E8CD98,0 8px 22px rgba(138,21,41,.45)}
.ghostplate{background:rgba(255,252,247,.7);color:#5A3A3E;border:1px solid rgba(158,27,50,.4);border-radius:4px;font-family:'Shippori Mincho',serif;font-weight:700}
.ghostplate:hover{background:#fff;color:#8A1529}
.qbtn{min-height:44px;padding:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
.qbtn span{font-family:'Shippori Mincho',serif;font-weight:700;font-size:11px;letter-spacing:.16em;padding:6px 12px;border-radius:999px;border:1px solid rgba(158,27,50,.35);background:rgba(255,252,247,.9);color:#6A4A4E}
.qbtn:hover span{background:#8A1529;color:#fff}
.route{position:absolute;top:0;padding:0;border:none;background:transparent}
.route:hover{filter:none!important}
.route .tag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;font-family:'Shippori Mincho',serif;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid}
.chip.good{color:#1F5C99;background:rgba(76,134,198,.14);border-color:rgba(76,134,198,.45)}
.chip.bad{color:#9A3412;background:rgba(201,99,42,.12);border-color:rgba(201,99,42,.45)}
.meter{position:relative;height:6px;background:rgba(106,74,78,.16);border-radius:999px}
.meter b{display:block;height:6px;border-radius:999px;transition:width .4s ease}
.meter s{position:absolute;top:-3px;width:2px;height:12px;background:#3B2A2E}
.pips{display:flex;gap:5px}.pips span{flex:1;height:6px;border-radius:999px;border:1px solid}
@keyframes pop{0%{opacity:0;transform:translateX(26px)}100%{opacity:1;transform:none}}.pop{animation:pop .45s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}.rise{animation:rise .4s ease both}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}.fadein{animation:fadein .5s ease both}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}.bob{display:inline-block;animation:bob 1s ease-in-out infinite}
@keyframes fallP{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(-34px,450px) rotate(200deg)}100%{transform:translate(22px,900px) rotate(400deg)}}
@keyframes fallD{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(-34px,390px) rotate(200deg)}100%{transform:translate(22px,780px) rotate(400deg)}}
.leaf{position:absolute;top:-30px;border-radius:0 80% 0 80%;opacity:.85;animation-timing-function:linear;animation-iteration-count:infinite}
#stage.phone .leaf{animation-name:fallP}#stage.desktop .leaf{animation-name:fallD}
.loading{position:absolute;left:50%;transform:translateX(-50%);font-family:'Shippori Mincho',serif;font-weight:700;font-size:13px;color:#5A3A3E;background:rgba(255,252,247,.9);border:1px solid rgba(158,27,50,.35);border-radius:999px;padding:6px 14px}
</style>
</head>
<body>
<div id="viewport"><div id="stage" class="desktop">
<img class="bg" src="campus-photo.webp" alt="">
<div id="leaves" aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;pointer-events:none"></div>
<div id="screen"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
// ---------- display data (story text and rules all come from app.py at run time) ----------
var ROLES = {
  instr: { num: '1', name: 'Leff Jucas', first: 'Leff', title: 'Instructor', route: 'Route I', difficulty: 'Easy', file: 'instr_events.txt',
    goal: 'Get promoted to UA President.', goalDetail: 'Dean approval 75+, student satisfaction 65+ and colleague satisfaction 65+.', lose: 'Fired if any score hits 0.',
    stats: [{ k: 'dean', label: 'Dean approval', short: 'Dean', goal: 75, min: 0 }, { k: 'students', label: 'Student satisfaction', short: 'Students', goal: 65, min: 0 }, { k: 'colleagues', label: 'Colleague satisfaction', short: 'Colleagues', goal: 65, min: 0 }] },
  ta: { num: '2', name: 'Wessica Jeaver', first: 'Wessica', title: 'Teaching Assistant', route: 'Route II', difficulty: 'Medium', file: 'ta_events.txt',
    goal: 'Get promoted to Instructor.', goalDetail: 'Instructor trust 65+ and student rapport 60+.', lose: 'Fired if trust or rapport hits 0.',
    stats: [{ k: 'trust', label: 'Instructor trust', short: 'Trust', goal: 65, min: 0 }, { k: 'rapport', label: 'Student rapport', short: 'Rapport', goal: 60, min: 0 }] },
  student: { num: '3', name: 'Peanne Jark', first: 'Peanne', title: 'Student', route: 'Route III', difficulty: 'Difficult', file: 'student_events.txt',
    goal: 'Finish MIS 221 with an A+.', goalDetail: 'Raise your grade to 97 or higher through pop quizzes and campus events.', lose: 'Expelled at 3 integrity strikes.',
    stats: [{ k: 'grade', label: 'Course grade', short: 'Grade', goal: 97, min: 80 }, { k: 'strikes', label: 'Integrity strikes', short: 'Strikes', max: 3 }] }
};
var ORDER = ['instr', 'ta', 'student'];
function sprite(k, mood) { return k + '-' + mood + '.webp'; }
var L = {
  phone: { W: 390, H: 844, menuPos: [-6, 100, 206], routeW: 190, routeH: 300, routeImgH: 285, tagSize: 12, sprite: 'left:0;top:150px;width:390px;height:585px', ask: -92, outcome: -70,
    titleBox: 'top:44px;left:0;right:0;align-items:center;text-align:center', t1: 11, t2: 26, t3: 56, t4: 13, lineupTop: 224,
    info: 'left:12px;right:12px;bottom:18px;padding:30px 20px 18px',
    hud: 'top:14px;left:12px;right:12px;padding:10px 14px 12px', hudShort: true,
    choices: 'right:0;top:176px;width:268px', choicePad: '12px 22px 12px 34px', choiceSize: 14, quizSize: 13,
    card: 'right:12px;top:200px;width:196px', cardSize: 14,
    dlg: 'left:10px;right:10px;bottom:16px;min-height:172px;padding:28px 20px 16px', dlgSize: 16,
    log: 'left:14px;right:14px;top:64px;bottom:64px',
    endSprite: 'left:-30px;top:176px;width:390px;height:585px', endTitle: 'top:46px;left:0;right:0', endSize: 60, endTag: 12,
    slip: 'right:16px;top:176px;width:128px', endWin: 'left:10px;right:10px;bottom:16px;padding:28px 20px 16px' },
  desktop: { W: 1280, H: 720, menuPos: [560, 750, 940], routeW: 320, routeH: 500, routeImgH: 480, tagSize: 15, sprite: 'left:80px;top:70px;width:440px;height:660px', ask: 0, outcome: -20,
    titleBox: 'top:70px;left:80px;width:460px;align-items:flex-start;text-align:left', t1: 13, t2: 36, t3: 84, t4: 16, lineupTop: 96,
    info: 'left:80px;width:440px;top:340px;padding:32px 24px 20px',
    hud: 'top:22px;right:28px;width:520px;padding:12px 18px 14px', hudShort: false,
    choices: 'left:560px;top:168px;width:620px', choicePad: '14px 70px 14px 76px', choiceSize: 18, quizSize: 16,
    card: 'left:560px;top:190px;width:400px', cardSize: 18,
    dlg: 'left:60px;right:60px;bottom:22px;min-height:160px;padding:30px 32px 18px', dlgSize: 20,
    log: 'left:50%;margin-left:-380px;width:760px;top:48px;bottom:48px',
    endSprite: 'left:80px;top:70px;width:440px;height:660px', endTitle: 'top:96px;left:540px;width:520px', endSize: 104, endTag: 15,
    slip: 'right:60px;top:290px;width:160px', endWin: 'left:60px;right:60px;bottom:22px;padding:30px 32px 18px' }
};

// ---------- state ----------
var S = { screen: 'menu', sel: 'instr', loading: true, error: '' };
var engine = null;
var mode = 'desktop';

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10); }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

// ---------- game flow (every rule decided by app.py) ----------
function begin(key) {
  if (!engine) return;
  var r = ROLES[key];
  var v = engine.newGame(r.num);
  var total = key === 'student' ? engine.countLines('quiz.txt') + engine.countLines('student_events.txt') : engine.countLines(r.file);
  S = { screen: 'play', sel: key, role: key, stats: v.stats, question: v.question, round: 1, total: total, phase: 'ask', mood: 'neutral', log: [], showLog: false };
  render();
}

function choose(i) {
  var q = S.question;
  var letter = 'abcd'[i];
  var res = engine.answer(letter);
  var before = S.stats;
  var after = Object.assign({}, before, res.stats);
  var deltas = [], net = 0, worse = false;
  ROLES[S.role].stats.forEach(function (st) {
    var d = Math.round((after[st.k] - before[st.k]) * 10) / 10;
    if (!d) return;
    if (st.k === 'strikes') { if (d > 0) worse = true; } else net += d;
    var good = st.k === 'strikes' ? d < 0 : d > 0;
    deltas.push({ text: st.short + ' ' + (d > 0 ? '+' : '') + fmt(d), good: good });
  });
  S.stats = after;
  S.outcome = { text: res.story.join(' '), chosen: q.choices[i], deltas: deltas };
  S.mood = worse || net < 0 ? 'worried' : (net > 0 ? 'happy' : 'neutral');
  S.log.push({ n: S.round, prompt: q.prompt, chosen: q.choices[i], text: S.outcome.text });
  S.next = res;
  S.phase = 'outcome';
  render();
}

function next() {
  var res = S.next;
  if (res.finished) {
    var line = res.ending || '';
    S.end = {
      win: /VICTORY$/.test(line),
      headline: line.replace(/\s*(VICTORY|GAME OVER)$/, '').replace(/^GAME OVER!\s*/, ''),
      fortune: res.fortune, thanks: res.thanks
    };
    S.screen = 'end';
  } else {
    S.question = res.question; S.round += 1; S.phase = 'ask'; S.mood = 'neutral';
  }
  render();
}

// ---------- rendering ----------
function ribbon(text) { return '<span class="ribbon"><i>◆</i>' + esc(text) + '</span>'; }

function renderMenu(m) {
  var sel = ROLES[S.sel];
  var h = '<div class="abs" style="left:0;top:0;width:100%;height:100%;background:' +
    (mode === 'phone' ? 'linear-gradient(180deg,rgba(255,250,242,.55) 0%,rgba(255,250,242,0) 26%,rgba(40,20,26,0) 60%,rgba(40,20,26,.45) 100%)'
      : 'linear-gradient(90deg,rgba(255,250,242,.72) 0%,rgba(255,250,242,.45) 36%,rgba(255,250,242,0) 55%),linear-gradient(180deg,rgba(40,20,26,0) 60%,rgba(40,20,26,.4) 100%)') + '"></div>';
  h += '<div class="abs fadein" style="' + m.titleBox + ';display:flex;flex-direction:column;gap:2px">' +
    '<span class="mincho" style="font-weight:700;font-size:' + m.t1 + 'px;letter-spacing:.34em;color:#8A1529">MIS 221 · BUSINESS PROGRAMMING I</span>' +
    '<span class="mincho" style="margin-top:8px;font-weight:700;font-size:' + m.t2 + 'px;line-height:1;color:#3B2A2E;text-shadow:0 0 14px rgba(255,255,255,.95)">Choose Your</span>' +
    '<h1 class="mincho" style="margin:0;font-weight:800;font-size:' + m.t3 + 'px;line-height:1.05;color:#8A1529;text-shadow:0 0 2px #fff,0 0 18px rgba(255,255,255,.95),0 3px 0 rgba(232,205,152,.9)">Journey</h1>' +
    '<span style="font-size:' + m.t4 + 'px;font-weight:700;color:#5A3A3E;letter-spacing:.08em;text-shadow:0 0 10px rgba(255,255,255,.95)">— a campus story —</span></div>';
  h += '<div class="abs" style="left:0;top:' + m.lineupTop + 'px;width:100%;height:' + (m.routeH + 20) + 'px">';
  ORDER.forEach(function (k, i) {
    var r = ROLES[k], on = k === S.sel;
    h += '<button class="btn route" data-act="select" data-key="' + k + '" aria-pressed="' + on + '" aria-label="' + esc(r.title + ' ' + r.name) + '" style="left:' + m.menuPos[i] + 'px;width:' + m.routeW + 'px;height:' + m.routeH + 'px;z-index:' + (on ? 3 : (i === 1 ? 2 : 1)) +
      ';filter:' + (on ? 'none' : 'saturate(.55) brightness(.78)') + ';transform:translateY(' + (on ? -8 : 0) + 'px) scale(' + (on ? 1.04 : 0.96) + ')">' +
      '<img src="' + sprite(k, on ? 'happy' : 'neutral') + '" alt="" style="width:' + m.routeW + 'px;height:' + m.routeImgH + 'px;display:block">' +
      '<span class="tag" style="font-size:' + m.tagSize + 'px;' + (on ? 'background:linear-gradient(90deg,#8A1529,#C2364F);color:#fff;border-color:#E8CD98' : 'background:rgba(255,252,247,.88);color:#6A4A4E;border-color:rgba(158,27,50,.35)') + '">' + esc(r.title) + '</span></button>';
  });
  h += '</div>';
  h += '<div class="win rise" style="' + m.info + '">' + ribbon(sel.name) +
    '<span class="mincho" style="position:absolute;top:10px;right:16px;font-weight:700;font-size:11px;letter-spacing:.14em;color:#8A6A6E">' + esc(sel.route + ' · ' + sel.difficulty) + '</span>' +
    '<p style="margin:0;font-size:15px;line-height:1.6"><strong style="color:#8A1529">Goal</strong>  ' + esc(sel.goal) + '</p>' +
    '<p style="margin:0;font-size:13px;line-height:1.55;color:#6A4A4E">' + esc(sel.goalDetail) + '</p>' +
    '<p style="margin:0;font-size:15px;line-height:1.6"><strong style="color:#9A3412">Lose</strong>  ' + esc(sel.lose) + '</p>' +
    '<button class="btn plate" data-act="begin" ' + (S.loading ? 'disabled ' : '') + 'style="margin-top:6px;min-height:52px;font-size:18px;letter-spacing:.06em;' + (S.loading ? 'opacity:.6;cursor:wait' : '') + '">' +
    (S.loading ? 'Loading Python…' : 'Begin ' + esc(sel.first) + "'s story") + '</button>' +
    (S.error ? '<p style="margin:0;font-size:13px;color:#9A3412">' + esc(S.error) + '</p>' : '') + '</div>';
  return h;
}

function renderStats(m) {
  var r = ROLES[S.role];
  var h = '<div style="display:grid;grid-template-columns:repeat(' + r.stats.length + ',minmax(0,1fr));gap:12px">';
  r.stats.forEach(function (st) {
    var v = S.stats[st.k];
    h += '<div style="display:flex;flex-direction:column;gap:5px;min-width:0"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:4px">' +
      '<span style="font-size:' + (m.hudShort ? 11 : 12) + 'px;font-weight:700;color:#6A4A4E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(m.hudShort ? st.short : st.label) + '</span>' +
      '<span class="mincho" style="font-weight:800;font-size:15px;color:#3B2A2E">' + (st.max ? fmt(v) + ' / ' + st.max : fmt(v)) + '</span></div>';
    if (st.max) {
      h += '<div class="pips">';
      for (var i = 0; i < st.max; i++) h += '<span style="' + (i < v ? 'background:#C2364F;border-color:#8A1529' : 'background:transparent;border-color:rgba(106,74,78,.45)') + '"></span>';
      h += '</div>';
    } else {
      var span = 100 - st.min, pct = Math.max(0, Math.min(100, (v - st.min) / span * 100));
      var fill = v >= st.goal ? 'linear-gradient(90deg,#4C86C6,#7DB7EE)' : (v <= 15 ? 'linear-gradient(90deg,#C9632A,#F2A65A)' : 'linear-gradient(90deg,#8A1529,#D2546B)');
      h += '<div class="meter"><b style="width:' + pct + '%;background:' + fill + '"></b><s style="left:' + ((st.goal - st.min) / span * 100) + '%"></s></div>';
    }
    h += '</div>';
  });
  return h + '</div>';
}

function renderPlay(m) {
  var r = ROLES[S.role], ask = S.phase === 'ask';
  var h = '<img class="fadein" src="' + sprite(S.role, S.mood) + '" alt="' + esc(r.title + ' ' + r.name) + '" style="position:absolute;' + m.sprite + ';transition:transform .5s ease;transform:translateX(' + (ask ? m.ask : m.outcome) + 'px)">';
  h += '<div class="abs fadein" style="' + m.hud + ';box-sizing:border-box;background:rgba(255,252,247,.86);border:1px solid rgba(158,27,50,.35);border-radius:12px;box-shadow:0 0 0 3px rgba(255,252,247,.3),0 8px 20px rgba(30,12,18,.2);display:flex;flex-direction:column;gap:9px">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><span class="mincho" style="font-weight:700;font-size:14px">' + esc(r.title + ' · ' + r.first) + '</span>' +
    '<span class="mincho" style="font-weight:700;font-size:12px;letter-spacing:.16em;color:#8A1529">ROUND ' + pad2(S.round) + ' / ' + pad2(S.total) + '</span></div>' +
    '<div style="height:2px;background:rgba(106,74,78,.18)"><div style="height:2px;background:linear-gradient(90deg,#C9A060,#8A1529);transition:width .4s ease;width:' + Math.round((S.round - (ask ? 1 : 0)) / S.total * 100) + '%"></div></div>' +
    renderStats(m) + '</div>';
  var q = S.question;
  if (ask) {
    var quiz = q.kind === 'quiz';
    h += '<div class="abs" style="' + m.choices + ';display:flex;flex-direction:column;gap:12px">';
    q.choices.forEach(function (c, i) {
      h += '<button class="btn choice pop" data-act="choose" data-i="' + i + '" style="padding:' + m.choicePad + ';min-height:50px;font-size:' + (quiz ? m.quizSize : m.choiceSize) + 'px;animation-delay:' + (0.1 + i * 0.1) + 's">' +
        '<span class="line" style="top:0"></span><span class="line" style="bottom:0"></span><span class="mark">◆ ' + 'ABCD'[i] + '</span><span>' + esc(c) + '</span></button>';
    });
    h += '</div>';
  } else {
    h += '<div class="abs pop" style="' + m.card + ';background:rgba(255,252,247,.94);border:1px solid rgba(158,27,50,.4);border-radius:10px;box-shadow:0 0 0 3px rgba(255,252,247,.35),0 8px 18px rgba(30,12,18,.25);padding:22px 14px 12px">' +
      '<span class="mincho" style="position:absolute;top:-11px;left:10px;background:linear-gradient(90deg,#7A1224,#B42A44);color:#fff;font-weight:700;font-size:11px;letter-spacing:.08em;padding:4px 16px 4px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)">' + esc(r.first) + "'s choice</span>" +
      '<span style="font-size:' + m.cardSize + 'px;font-weight:700;line-height:1.5">“' + esc(S.outcome.chosen) + '”</span></div>';
  }
  h += '<div class="win rise" style="' + m.dlg + '">' +
    '<div style="position:absolute;top:-50px;right:0;display:flex;gap:4px">' +
    '<button class="btn qbtn" data-act="log" style="min-width:56px"><span>LOG</span></button>' +
    '<button class="btn qbtn" data-act="title" style="min-width:64px"><span>TITLE</span></button></div>';
  if (ask) {
    h += ribbon(q.kind === 'quiz' ? 'Pop Quiz' : 'Campus Event') +
      '<p style="margin:0;font-size:' + m.dlgSize + 'px;font-weight:500;line-height:1.75">' + esc(q.prompt) + '</p>' +
      '<p style="margin:0;font-size:' + (m.dlgSize - 3) + 'px;font-weight:700;color:#8A1529">' + (q.kind === 'quiz' ? 'Choose ' + esc(r.first) + "'s answer." : 'What will ' + esc(r.first) + ' do?') + '</p>';
  } else {
    h += '<p style="margin:0;font-size:' + m.dlgSize + 'px;font-weight:500;line-height:1.75">' + esc(S.outcome.text) + '</p><div style="display:flex;flex-wrap:wrap;gap:6px">' +
      (S.outcome.deltas.length ? S.outcome.deltas.map(function (d) { return '<span class="chip ' + (d.good ? 'good' : 'bad') + '">' + esc(d.text) + '</span>'; }).join('') : '<span style="font-size:12px;font-weight:700;color:#8A6A6E">No change to your stats.</span>') +
      '</div><button class="btn ghostplate" data-act="next" style="align-self:flex-end;min-height:44px;padding:0 16px;font-size:15px;display:flex;align-items:center;gap:8px">' +
      (S.next.finished ? 'To the ending' : 'Next') + ' <span class="bob" style="color:#8A1529;font-size:12px">▼</span></button>';
  }
  h += '</div>';
  if (S.showLog) {
    h += '<div class="abs fadein" style="left:0;top:0;width:100%;height:100%;background:rgba(30,14,20,.6);backdrop-filter:blur(3px)">' +
      '<div role="dialog" aria-label="Backlog" class="abs" style="' + m.log + ';background:rgba(255,252,247,.97);border:1px solid rgba(158,27,50,.45);border-radius:14px;box-shadow:0 0 0 4px rgba(255,252,247,.3),0 0 0 5px rgba(201,160,96,.6);display:flex;flex-direction:column">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 10px 10px 20px;border-bottom:1px solid rgba(201,160,96,.6)"><span class="mincho" style="font-weight:800;font-size:20px;color:#8A1529;letter-spacing:.1em">Backlog</span>' +
      '<button class="btn ghostplate" data-act="closelog" style="min-height:44px;padding:0 16px;font-size:14px">Close</button></div>' +
      '<div style="flex:1;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:16px">' +
      (S.log.length ? S.log.slice().reverse().map(function (l) {
        return '<div style="display:flex;flex-direction:column;gap:4px;padding-bottom:14px;border-bottom:1px dashed rgba(158,27,50,.25)"><span class="mincho" style="font-weight:700;font-size:11px;letter-spacing:.16em;color:#8A6A6E">ROUND ' + l.n + '</span>' +
          '<span style="font-size:13px;line-height:1.55;color:#6A4A4E">' + esc(l.prompt) + '</span><span style="font-size:14px;font-weight:700;color:#8A1529">“' + esc(l.chosen) + '”</span><span style="font-size:14px;line-height:1.6">' + esc(l.text) + '</span></div>';
      }).join('') : '<p style="margin:0;font-size:14px;color:#6A4A4E">Nothing yet. Make your first choice.</p>') + '</div></div></div>';
  }
  return h;
}

function renderEnd(m) {
  var r = ROLES[S.role], e = S.end, desk = mode === 'desktop';
  var h = '<div class="abs" style="left:0;top:0;width:100%;height:100%;background:' + (e.win ? 'radial-gradient(ellipse at 70% 30%,rgba(255,236,190,.55),rgba(255,236,190,0) 60%),linear-gradient(180deg,rgba(255,246,230,.25),rgba(40,20,26,.35))' : 'linear-gradient(180deg,rgba(36,30,64,.55),rgba(28,16,24,.6))') + '"></div>';
  h += '<img class="fadein" src="' + sprite(S.role, e.win ? 'happy' : 'worried') + '" alt="' + esc(r.title + ' ' + r.name) + '" style="position:absolute;' + m.endSprite + '">';
  h += '<div class="abs rise" style="' + m.endTitle + ';display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center">' +
    '<span class="mincho" style="font-weight:700;font-size:' + m.endTag + 'px;letter-spacing:.34em;color:#FFF6E8;background:linear-gradient(90deg,rgba(138,21,41,0),rgba(138,21,41,.9),rgba(138,21,41,0));padding:5px 40px">' + (e.win ? 'TRUE ENDING' : 'BAD ENDING') + '</span>' +
    '<h1 class="mincho" style="margin:0;font-weight:800;font-size:' + m.endSize + 'px;line-height:1.1;color:' + (e.win ? '#8A1529' : '#3B3550') + ';text-shadow:0 0 2px #fff,0 0 20px rgba(255,255,255,.95),0 3px 0 rgba(232,205,152,.9)">' + (e.win ? 'Victory' : 'Game Over') + '</h1></div>';
  var f0 = e.fortune[0] || '', f1 = (e.fortune[1] || '').replace(/^YOUR LUCKY NUMBERS:\s*/, '').split(/,\s*/).join(' · ');
  h += '<div class="abs pop" style="' + m.slip + ';background:#FFFCF3;border:1px solid #D9C7A6;box-shadow:0 8px 18px rgba(30,12,18,.3);transform:rotate(3deg);display:flex;flex-direction:column;align-items:center;text-align:center">' +
    '<span class="mincho" style="width:100%;background:#A3203A;color:#fff;font-weight:800;font-size:30px;padding:6px 0 4px;letter-spacing:.1em">' + (e.win ? '大吉' : '末吉') + '</span>' +
    '<span class="mincho" style="font-weight:700;font-size:10px;letter-spacing:.12em;color:#A3203A;padding:6px 6px 0;text-transform:uppercase">' + (e.win ? 'Great blessing' : 'Blessing yet to come') + '</span>' +
    '<span style="font-size:' + (desk ? 15 : 12) + 'px;font-weight:700;line-height:1.45;padding:6px 10px">' + esc(f0) + '</span><span style="width:80%;border-top:1px dashed #D9C7A6"></span>' +
    '<span style="font-size:' + (desk ? 12 : 10) + 'px;font-weight:700;line-height:1.5;color:#6A4A4E;padding:6px 8px 10px">Lucky numbers<br>' + esc(f1) + '</span></div>';
  var stats = ROLES[S.role].stats.map(function (st) { var v = S.stats[st.k]; return '<div style="display:flex;' + (desk ? 'gap:10px' : 'justify-content:space-between;gap:10px') + ';font-size:' + (desk ? 15 : 14) + 'px"><span style="color:#6A4A4E">' + esc(st.label) + '</span><span class="mincho" style="font-weight:800">' + (st.max ? fmt(v) + ' / ' + st.max : fmt(v)) + '</span></div>'; }).join('');
  var buttons = '<button class="btn plate" data-act="replay" style="flex:1;min-height:48px;font-size:15px">Play again</button><button class="btn ghostplate" data-act="title" style="flex:1;min-height:48px;font-size:15px">Title screen</button>';
  h += '<div class="win rise" style="' + m.endWin + ';' + (desk ? 'display:grid;grid-template-columns:minmax(0,1fr) 240px;column-gap:32px;row-gap:10px;align-items:center' : '') + '">' + ribbon(r.name) +
    '<p class="mincho" style="margin:0;font-weight:800;font-size:' + (desk ? 26 : 21) + 'px;line-height:1.35;grid-column:1">' + esc(e.headline) + '</p>' +
    '<div style="grid-column:1;display:flex;flex-direction:' + (desk ? 'row;flex-wrap:wrap;column-gap:28px' : 'column') + ';row-gap:6px;gap:6px;padding:10px 0;border-top:1px solid rgba(201,160,96,.6);border-bottom:1px solid rgba(201,160,96,.6)">' + stats + '</div>' +
    '<div style="' + (desk ? 'grid-column:2;grid-row:1 / span 3;flex-direction:column;' : '') + 'display:flex;gap:10px">' + buttons + '</div>' +
    '<p style="margin:0;grid-column:1;' + (desk ? '' : 'text-align:center;') + 'font-size:12px;font-weight:700;color:#8A6A6E">' + esc(e.thanks) + '</p></div>';
  return h;
}

function render() {
  var m = L[mode];
  var el = document.getElementById('screen');
  el.innerHTML = S.screen === 'menu' ? renderMenu(m) : S.screen === 'play' ? renderPlay(m) : renderEnd(m);
}

document.getElementById('screen').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act');
  if (act === 'select') { S.sel = b.getAttribute('data-key'); render(); }
  else if (act === 'begin') begin(S.sel);
  else if (act === 'choose') choose(+b.getAttribute('data-i'));
  else if (act === 'next') next();
  else if (act === 'log') { S.showLog = true; render(); }
  else if (act === 'closelog') { S.showLog = false; render(); }
  else if (act === 'title') { S = { screen: 'menu', sel: S.sel || 'instr', loading: !engine }; render(); }
  else if (act === 'replay') begin(S.role);
});

// ---------- fit the fixed-size stage to any screen ----------
function fit() {
  var want = window.innerWidth / window.innerHeight < 0.9 ? 'phone' : 'desktop';
  var stage = document.getElementById('stage');
  if (want !== mode) { mode = want; stage.className = mode; render(); }
  var m = L[mode];
  var scale = Math.min(window.innerWidth / m.W, window.innerHeight / m.H);
  stage.style.transform = 'scale(' + scale + ')';
}
(function leaves() {
  var cols = ['#E08A2E', '#F2B53F', '#C9632A', '#E9A23B'], h = '';
  for (var i = 0; i < 12; i++) h += '<span class="leaf" style="left:' + ((i * 37 + 11) % 100) + '%;background:' + cols[i % 4] + ';animation-duration:' + (9 + (i * 7) % 8) + 's;animation-delay:-' + ((i * 13) % 11) + 's;width:' + (9 + i % 3 * 3) + 'px;height:' + (6 + i % 3 * 2) + 'px"></span>';
  document.getElementById('leaves').innerHTML = h;
})();
mode = window.innerWidth / window.innerHeight < 0.9 ? 'phone' : 'desktop';
document.getElementById('stage').className = mode;
window.addEventListener('resize', fit);
render(); fit();

// ---------- start Python and load the unchanged game files from the repo ----------
(async function () {
  try {
    var py = await loadPyodide();
    var e = new MISEngine.Engine(py);
    await e.load(async function (name) {
      var res = await fetch(name, { cache: 'no-cache' });
      if (!res.ok) throw new Error('Could not load ' + name + ' (' + res.status + ')');
      return res.text();
    });
    engine = e; S.loading = false;
  } catch (err) {
    S.error = 'The game could not start: ' + err.message;
  }
  if (S.screen === 'menu') render();
})();
</script>
</body>
